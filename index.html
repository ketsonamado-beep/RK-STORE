<!DOCTYPE html>
<html lang="pt-AO">
<head>
<meta charset="UTF-8" />
<meta name="viewport" content="width=device-width, initial-scale=1" />
<title>RK Store - Comércio Eletrónico</title>
<style>
  /* Reset */
  *, *::before, *::after { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
    background: #f5f6fa;
    color: #333;
    min-height: 100vh;
    display: flex;
    flex-direction: column;
  }
  header {
    background: #0073e6;
    color: white;
    padding: 15px 20px;
    display: flex;
    align-items: center;
    justify-content: space-between;
    flex-wrap: wrap;
  }
  header h1 {
    font-weight: 700;
    font-size: 1.8rem;
    cursor: default;
  }
  #search-bar {
    flex-grow: 1;
    max-width: 400px;
    margin: 10px 20px;
    position: relative;
  }
  #search-bar input[type="search"] {
    width: 100%;
    padding: 10px 40px 10px 15px;
    border-radius: 25px;
    border: none;
    font-size: 1rem;
  }
  #search-bar button {
    position: absolute;
    right: 5px;
    top: 50%;
    transform: translateY(-50%);
    background: transparent;
    border: none;
    color: #0073e6;
    font-size: 1.2rem;
    cursor: pointer;
  }
  nav {
    display: flex;
    gap: 15px;
    flex-wrap: wrap;
    margin-top: 5px;
  }
  nav button {
    background: transparent;
    border: 2px solid white;
    color: white;
    padding: 5px 15px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s;
  }
  nav button:hover, nav button.active {
    background: white;
    color: #0073e6;
  }
  main {
    flex-grow: 1;
    padding: 20px;
    max-width: 1200px;
    margin: auto;
  }
  .banner {
    position: relative;
    overflow: hidden;
    border-radius: 10px;
    margin-bottom: 25px;
  }
  .banner img {
    width: 100%;
    display: block;
    max-height: 300px;
    object-fit: cover;
    border-radius: 10px;
  }
  .banner-text {
    position: absolute;
    bottom: 20px;
    left: 30px;
    color: white;
    font-size: 1.8rem;
    font-weight: 700;
    text-shadow: 0 0 10px rgba(0,0,0,0.6);
  }
  .categories {
    margin-bottom: 30px;
    display: flex;
    flex-wrap: wrap;
    gap: 15px;
    justify-content: center;
  }
  .category {
    background: #0073e6;
    color: white;
    padding: 12px 20px;
    border-radius: 30px;
    cursor: pointer;
    font-weight: 600;
    user-select: none;
    transition: background 0.3s;
  }
  .category:hover, .category.active {
    background: #005bb5;
  }
  .products-grid {
    display: grid;
    grid-template-columns: repeat(auto-fill, minmax(190px, 1fr));
    gap: 20px;
  }
  .product-card {
    background: white;
    border-radius: 10px;
    box-shadow: 0 4px 12px rgb(0 0 0 / 0.1);
    cursor: pointer;
    display: flex;
    flex-direction: column;
    justify-content: space-between;
    padding: 15px;
    transition: transform 0.2s;
  }
  .product-card:hover {
    transform: translateY(-6px);
  }
  .product-image {
    width: 100%;
    height: 150px;
    object-fit: contain;
    margin-bottom: 10px;
  }
  .product-name {
    font-weight: 700;
    margin-bottom: 5px;
    font-size: 1rem;
    height: 48px;
    overflow: hidden;
  }
  .product-price {
    font-weight: 600;
    color: #0073e6;
    font-size: 1.1rem;
  }
  .add-to-cart-btn {
    margin-top: 10px;
    background: #0073e6;
    color: white;
    border: none;
    padding: 8px;
    border-radius: 20px;
    cursor: pointer;
    font-weight: 600;
    transition: background 0.3s;
  }
  .add-to-cart-btn:hover {
    background: #005bb5;
  }
  /* Carrinho e perfil */
  #user-cart, #user-profile {
    position: fixed;
    top: 60px;
    right: 20px;
    width: 320px;
    max-height: 80vh;
    overflow-y: auto;
    background: white;
    border-radius: 10px;
    box-shadow: 0 6px 25px rgb(0 0 0 / 0.2);
    z-index: 2000;
    display: none;
    flex-direction: column;
  }
  #user-cart.active, #user-profile.active {
    display: flex;
  }
  #user-cart header, #user-profile header {
    padding: 15px;
    background: #0073e6;
    color: white;
    font-weight: 700;
    font-size: 1.25rem;
    border-radius: 10px 10px 0 0;
    display: flex;
    justify-content: space-between;
    align-items: center;
  }
  #user-cart header button, #user-profile header button {
    background: transparent;
    border: none;
    color: white;
    font-size: 1.3rem;
    cursor: pointer;
  }
  #cart-items, #profile-content {
    padding: 15px;
    flex-grow: 1;
    overflow-y: auto;
  }
  .cart-item {
    display: flex;
    align-items: center;
    gap: 10px;
    margin-bottom: 15px;
  }
  .cart-item img {
    width: 50px;
    height: 50px;
    object-fit: contain;
  }
  .cart-item-info {
    flex-grow: 1;
  }
  .cart-item-name {
    font-weight: 700;
    font-size: 1rem;
    margin-bottom: 3px;
  }
  .cart-item-price {
    color: #0073e6;
    font-weight: 600;
  }
  .cart-item-qty {
    display: flex;
    align-items: center;
    gap: 5px;
  }
  .qty-btn {
    border: none;
    background: #0073e6;
    color: white;
    border-radius: 4px;
    font-size: 1rem;
    cursor: pointer;
    padding: 2px 7px;
    user-select: none;
  }
  .checkout-btn {
    width: 100%;
    padding: 10px 15px;
    background: #0073e6;
    color: white;
    border: none;
    font-weight: 700;
    cursor: pointer;
    border-radius: 8px;
    margin-top: 10px;
  }
  .checkout-btn:hover {
    background: #005bb5;
  }
  /* Login/Registo */
  form {
    display: flex;
    flex-direction: column;
    gap: 15px;
  }
  form label {
    font-weight: 600;
  }
  form input[type="email"], form input[type="password"], form input[type="text"] {
    padding: 10px 12px;
    font-size: 1rem;
    border: 1px solid #ccc;
    border-radius: 6px;
  }
  form button {
    padding: 10px;
    background: #0073e6;
    color: white;
    border: none;
    font-weight: 700;
    cursor: pointer;
    border-radius: 6px;
  }
  form button:hover {
    background: #005bb5;
  }
  .form-switch {
    margin-top: 10px;
    font-size: 0.9rem;
    color: #0073e6;
    cursor: pointer;
    text-align: center;
  }
  /* Navbar user/cart icons */
  #user-actions {
    display: flex;
    align-items: center;
    gap: 15px;
  }
  #user-actions button {
    background: transparent;
    border: none;
    color: white;
    cursor: pointer;
    font-size: 1.4rem;
    position: relative;
  }
  #cart-count {
    position: absolute;
    top: -5px;
    right: -8px;
    background: #e84118;
    border-radius: 50%;
    font-size: 0.75rem;
    font-weight: 700;
    padding: 2px 6px;
    color: white;
  }
  /* Responsividade */
  @media (max-width: 600px) {
    header {
      justify-content: center;
      gap: 10px;
    }
    #search-bar {
      max-width: 100%;
      margin: 10px 0;
    }
    nav {
      justify-content: center;
      gap: 10px;
    }
    #user-cart, #user-profile {
      width: 90vw;
      right: 5vw;
      top: 55px;
      max-height: 70vh;
    }
  }
</style>
</head>
<body>

<header>
  <h1>RK Store</h1>
  <div id="search-bar">
    <input type="search" id="search-input" placeholder="Procurar produtos..." />
    <button aria-label="Pesquisar">&#128269;</button>
  </div>
  <nav id="categories-nav">
    <button class="category active" data-category="all">Todos</button>
    <button class="category" data-category="eletrônicos">Eletrônicos</button>
    <button class="category" data-category="moda">Moda</button>
    <button class="category" data-category="casa">Casa</button>
    <button class="category" data-category="brinquedos">Brinquedos</button>
  </nav>
  <div id="user-actions">
    <button id="btn-profile" title="Perfil">&#128100;</button>
    <button id="btn-cart" title="Carrinho">
      &#128722;
      <span id="cart-count" style="display:none;">0</span>
    </button>
  </div>
</header>

<main>
  <section class="banner">
    <img src="https://images.unsplash.com/photo-1506744038136-46273834b3fb?auto=format&fit=crop&w=1200&q=80" alt="Promoção Banner" />
    <div class="banner-text">Promoções Incríveis - Aproveite Agora!</div>
  </section>

  <section class="products-grid" id="products-grid">
    <!-- Produtos serão inseridos aqui via JavaScript -->
  </section>
</main>

<!-- Carrinho -->
<div id="user-cart">
  <header>
    Carrinho
    <button id="close-cart" aria-label="Fechar">&#10005;</button>
  </header>
  <div id="cart-items">
    <!-- Itens do carrinho -->
  </div>
  <button id="checkout-btn" class="checkout-btn">Finalizar Compra</button>
</div>

<!-- Perfil / Login / Registo -->
<div id="user-profile">
  <header>
    Perfil
    <button id="close-profile" aria-label="Fechar">&#10005;</button>
  </header>
  <div id="profile-content">
    <!-- Conteúdo do perfil ou login/registo aparecerá aqui -->
  </div>
</div>

<script>
  // Dados dos produtos (exemplo simples)
  const products = [
    {id:1, name:"Smartphone ZX-10", category:"eletrônicos", price:95000, img:"https://images.unsplash.com/photo-1511707171634-5f897ff02aa9?auto=format&fit=crop&w=300&q=60"},
    {id:2, name:"Relógio Inteligente", category:"eletrônicos", price:42000, img:"https://images.unsplash.com/photo-1519744792095-2f2205e87b6f?auto=format&fit=crop&w=300&q=60"},
    {id:3, name:"Vestido de Verão", category:"moda", price:15000, img:"https://images.unsplash.com/photo-1520975696600-0eb6bf8438f5?auto=format&fit=crop&w=300&q=60"},
    {id:4, name:"Tênis Esportivo", category:"moda", price:28000, img:"https://images.unsplash.com/photo-1526170375885-4d8ecf77b99f?auto=format&fit=crop&w=300&q=60"},
    {id:5, name:"Cadeira de Escritório", category:"casa", price:35000, img:"https://images.unsplash.com/photo-1505692794403-434c28ade29f?auto=format&fit=crop&w=300&q=60"},
    {id:6, name:"Lâmpada LED", category:"casa", price:5000, img:"https://images.unsplash.com/photo-1499428665500-0f2bf1b4a0b0?auto=format&fit=crop&w=300&q=60"},
    {id:7, name:"Carrinho de Controle Remoto", category:"brinquedos", price:25000, img:"https://images.unsplash.com/photo-1507874457470-272b3c8d8ee2?auto=format&fit=crop&w=300&q=60"},
    {id:8, name:"Quebra-Cabeça 1000 peças", category:"brinquedos", price:12000, img:"https://images.unsplash.com/photo-1470115636492-6d2b56f4c588?auto=format&fit=crop&w=300&q=60"},
  ];

  // Estado do carrinho
  let cart = JSON.parse(localStorage.getItem('rkstore_cart')) || [];

  // Usuário simulado para perfil
  let user = JSON.parse(localStorage.getItem('rkstore_user')) || null;

  // Exibe produtos conforme categoria e pesquisa
  function displayProducts(filterCategory = 'all', searchTerm = '') {
    const container = document.getElementById('products-grid');
    container.innerHTML = '';
    let filtered = products.filter(prod => {
      let matchCat = (filterCategory === 'all' || prod.category === filterCategory);
      let matchSearch = prod.name.toLowerCase().includes(searchTerm.toLowerCase());
      return matchCat && matchSearch;
    });
    if(filtered.length === 0) {
      container.innerHTML = '<p style="grid-column:1/-1; text-align:center;">Nenhum produto encontrado.</p>';
      return;
    }
    filtered.forEach(prod => {
      const card = document.createElement('div');
      card.className = 'product-card';
      card.innerHTML = `
        <img src="${prod.img}" alt="${prod.name}" class="product-image" />
        <div class="product-name">${prod.name}</div>
        <div class="product-price">${prod.price.toLocaleString('pt-AO')} Kz</div>
        <button class="add-to-cart-btn" data-id="${prod.id}">Adicionar ao Carrinho</button>
      `;
      container.appendChild(card);
    });
  }

  // Atualiza contador carrinho
  function updateCartCount() {
    const countElem = document.getElementById('cart-count');
    const totalQty = cart.reduce((acc, item) => acc + item.qty, 0);
    if(totalQty > 0) {
      countElem.style.display = 'inline-block';
      countElem.textContent = totalQty;
    } else {
      countElem.style.display = 'none';
    }
  }

  // Adiciona ao carrinho
  function addToCart(productId) {
    const product = products.find(p => p.id === productId);
    if(!product) return;
    let item = cart.find(i => i.id === productId);
    if(item) {
      item.qty++;
    } else {
      cart.push({id: productId, qty:1});
    }
    localStorage.setItem('rkstore_cart', JSON.stringify(cart));
    updateCartCount();
    alert(`Produto "${product.name}" adicionado ao carrinho.`);
  }

  // Exibe carrinho e itens
  function displayCart() {
    const cartDiv = document.getElementById('user-cart');
    const cartItemsContainer = document.getElementById('cart-items');
    cartItemsContainer.innerHTML = '';
    if(cart.length === 0) {
      cartItemsContainer.innerHTML = '<p>Carrinho vazio.</p>';
      return;
    }
    cart.forEach(item => {
      const product = products.find(p => p.id === item.id);
      if(!product) return;
      const div = document.createElement('div');
      div.className = 'cart-item';
      div.innerHTML = `
        <img src="${product.img}" alt="${product.name}" />
        <div class="cart-item-info">
          <div class="cart-item-name">${product.name}</div>
          <div class="cart-item-price">${(product.price * item.qty).toLocaleString('pt-AO')} Kz</div>
          <div class="cart-item-qty">
            <button class="qty-btn" data-id="${item.id}" data-action="decrease">-</button>
            <span>${item.qty}</span>
            <button class="qty-btn" data-id="${item.id}" data-action="increase">+</button>
          </div>
        </div>
        <button class="qty-btn" style="background:#e84118;" data-id="${item.id}" data-action="remove">×</button>
      `;
      cartItemsContainer.appendChild(div);
    });
  }

  // Atualiza quantidade no carrinho
  function updateCartItem(id, action) {
    let index = cart.findIndex(i => i.id === id);
    if(index === -1) return;

    if(action === 'increase') {
      cart[index].qty++;
    } else if(action === 'decrease') {
      cart[index].qty--;
      if(cart[index].qty <= 0) cart.splice(index, 1);
    } else if(action === 'remove') {
      cart.splice(index, 1);
    }
    localStorage.setItem('rkstore_cart', JSON.stringify(cart));
    updateCartCount();
    displayCart();
  }

  // Mostrar formulário de login ou perfil
  function showProfile() {
    const profileDiv = document.getElementById('user-profile');
    const content = document.getElementById('profile-content');

    if(user) {
      // Mostra perfil
      content.innerHTML = `
        <p><strong>Bem-vindo(a),</strong> ${user.name}</p>
        <p><strong>Email:</strong> ${user.email}</p>
        <button id="btn-logout">Sair</button>
      `;
      document.getElementById('btn-logout').onclick = () => {
        user = null;
        localStorage.removeItem('rkstore_user');
        showProfile();
      };
    } else {
      // Formulário login
      content.innerHTML = `
        <form id="login-form">
          <label for="email">Email</label>
          <input type="email" id="email" required />
          <label for="password">Senha</label>
          <input type="password" id="password" required />
          <button type="submit">Entrar</button>
          <div class="form-switch" id="switch-to-register">Não tem conta? Registe-se</div>
        </form>
      `;
      document.getElementById('switch-to-register').onclick = () => showRegister();
      document.getElementById('login-form').onsubmit = e => {
        e.preventDefault();
        // Autenticação simulada (email = qualquer, password = "1234")
        const emailVal = document.getElementById('email').value.trim();
        const passVal = document.getElementById('password').value.trim();
        if(passVal === '1234') {
          user = {name: emailVal.split('@')[0], email: emailVal};
          localStorage.setItem('rkstore_user', JSON.stringify(user));
          alert('Login efetuado com sucesso!');
          showProfile();
        } else {
          alert('senha incorreta! Use 1234 para teste.');
        }
      };
    }
  }

  // Mostrar formulário de registo
  function showRegister() {
    const content = document.getElementById('profile-content');
    content.innerHTML = `
      <form id="register-form">
        <label for="reg-name">Nome</label>
        <input type="text" id="reg-name" required />
        <label for="reg-email">Email</label>
        <input type="email" id="reg-email" required />
        <label for="reg-pass">Senha</label>
        <input type="password" id="reg-pass" required />
        <button type="submit">Registrar</button>
        <div class="form-switch" id="switch-to-login">Já tem conta? Faça login</div>
      </form>
    `;
    document.getElementById('switch-to-login').onclick = () => showProfile();
    document.getElementById('register-form').onsubmit = e => {
      e.preventDefault();
      // Registo simulado
      const name = document.getElementById('reg-name').value.trim();
      const email = document.getElementById('reg-email').value.trim();
      const pass = document.getElementById('reg-pass').value.trim();
      if(pass.length < 4) {
        alert('Senha deve ter no mínimo 4 caracteres');
        return;
      }
      user = {name, email};
      localStorage.setItem('rkstore_user', JSON.stringify(user));
      alert('Registo efetuado! Agora está logado.');
      showProfile();
    };
  }

  // Alternar selecção de categoria e mostrar produtos
  document.getElementById('categories-nav').addEventListener('click', e => {
    if(e.target.tagName === 'BUTTON') {
      document.querySelectorAll('#categories-nav button').forEach(btn => btn.classList.remove('active'));
      e.target.classList.add('active');
      const category = e.target.dataset.category;
      const searchValue = document.getElementById('search-input').value.trim();
      displayProducts(category, searchValue);
    }
  });

  // Pesquisa inteligente enquanto digita
  document.getElementById('search-input').addEventListener('input', e => {
    const categoryBtn = document.querySelector('#categories-nav button.active');
    const category = categoryBtn ? categoryBtn.dataset.category : 'all';
    displayProducts(category, e.target.value.trim());
  });

  // Clique em adicionar ao carrinho
  document.getElementById('products-grid').addEventListener('click', e => {
    if(e.target.classList.contains('add-to-cart-btn')) {
      const productId = parseInt(e.target.dataset.id);
      addToCart(productId);
    }
  });

  // Abrir / fechar carrinho
  document.getElementById('btn-cart').onclick = () => {
    displayCart();
    document.getElementById('user-cart').classList.toggle('active');
    // Fecha perfil se aberto
    document.getElementById('user-profile').classList.remove('active');
  };
  document.getElementById('close-cart').onclick = () => {
    document.getElementById('user-cart').classList.remove('active');
  };

  // Controle em itens do carrinho
  document.getElementById('cart-items').onclick = e => {
    if(e.target.classList.contains('qty-btn')) {
      const id = parseInt(e.target.dataset.id);
      const action = e.target.dataset.action;
      updateCartItem(id, action);
    }
  };

  // Finalizar compra (simulado)
  document.getElementById('checkout-btn').onclick = () => {
    if(cart.length === 0) {
      alert('Seu carrinho está vazio.');
      return;
    }
    if(!user) {
      alert('Por favor, faça login para finalizar a compra.');
      return;
    }
    alert(`Compra finalizada com sucesso, ${user.name}! Total: ${cart.reduce((acc, item) => {
      const p = products.find(pr => pr.id === item.id);
      return acc + (p.price * item.qty);
    }, 0).toLocaleString('pt-AO')} Kz`);
    cart = [];
    localStorage.setItem('rkstore_cart', JSON.stringify(cart));
    updateCartCount();
    displayCart();
    document.getElementById('user-cart').classList.remove('active');
  };

  // Abrir / fechar perfil
  document.getElementById('btn-profile').onclick = () => {
    showProfile();
    const prof = document.getElementById('user-profile');
    prof.classList.toggle('active');
    // Fecha carrinho se aberto
    document.getElementById('user-cart').classList.remove('active');
  };
  document.getElementById('close-profile').onclick = () => {
    document.getElementById('user-profile').classList.remove('active');
  };

  // Inicializar
  window.onload = () => {
    displayProducts();
    updateCartCount();
  };
</script>
</body>
</html>
